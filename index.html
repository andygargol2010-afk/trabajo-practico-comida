<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Buscar comida..." class="search-input">
            <select id="provinceSelect" class="province-select">
                <option value="">Todas las provincias</option>
            </select>
        </div>

        <div class="food-grid" id="foodGrid"></div>

        <div class="add-section">
            <input type="text" id="newFoodInput" placeholder="Agregar nueva comida..." class="food-input">
            <button id="addBtn" class="add-btn">Agregar</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
